<form class="panel add-form" novalidate (ngSubmit)="handleSubmit()">
  <h2 class="panel-title">Add a countdown</h2>
  <label class="field">
    <span>Name</span>
    <input name="name" placeholder="Product launch" [maxlength]="maxLength" [(ngModel)]="name" />
  </label>
  <label class="field">
    <span>Date</span>
    <input type="date" name="date" [(ngModel)]="date" />
  </label>
  @if (error()) {
    <p class="form-error" role="alert">{{ error() }}</p>
  }
  <button type="submit" class="button">Add countdown</button>
</form>
